# --- Extrait à injecter dans /opt/mozaiklabs/docker/nginx/nginx.conf ---
# (monté en read-only dans le conteneur mozaiklabs-nginx-1)
#
# Le fichier complet sur le VPS contient aussi :
#   - un catch-all default_server (ssl_reject_handshake) en tête
#   - les server blocks mozaiklabs.fr
#   - puis ce bloc ci-dessous

# =============================================================
# api.letremouille.fr
# =============================================================

# Limitation de débit (contexte http {}, comme les server ci-dessous).
# Noms de zones propres à ce site : ne pas les réutiliser ailleurs.
limit_req_zone  $binary_remote_addr zone=tremouille_api:1m  rate=10r/m;
limit_conn_zone $binary_remote_addr zone=tremouille_conn:1m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.letremouille.fr;
    return 301 https://api.letremouille.fr$request_uri;
}

# API proxy
server {
    listen 443 ssl;
    http2 on;
    server_name api.letremouille.fr;

    ssl_certificate /etc/letsencrypt/live/api.letremouille.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.letremouille.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # En-têtes de sécurité (réponses JSON uniquement)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Corps de requête : petits, lus vite, mis en tampon avant PHP
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        limit_req zone=tremouille_api burst=10 nodelay;
        limit_req_status 429;
        limit_conn tremouille_conn 5;
        limit_conn_status 429;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://172.18.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
