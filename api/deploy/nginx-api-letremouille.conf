# --- Extrait à injecter dans /opt/mozaiklabs/docker/nginx/nginx.conf ---
# (monté en read-only dans le conteneur mozaiklabs-nginx-1)
#
# Le fichier complet sur le VPS contient aussi :
#   - un catch-all default_server (ssl_reject_handshake) en tête
#   - les server blocks mozaiklabs.fr
#   - puis ce bloc ci-dessous

# =============================================================
# api.letremouille.fr
# =============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.letremouille.fr;
    return 301 https://api.letremouille.fr$request_uri;
}

# --- Limitation de débit (ces directives *_zone sont du contexte http : cet extrait
#     est inclus dans le bloc http du nginx.conf partagé, donc elles se posent ici) ---
# 10 requêtes/minute par adresse IP (une réservation = 1 requête de pré-vérification + 1 POST)
limit_req_zone  $binary_remote_addr zone=tremouille_api_req:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=tremouille_api_conn:1m;

# API proxy
server {
    listen 443 ssl;
    http2 on;
    server_name api.letremouille.fr;

    ssl_certificate /etc/letsencrypt/live/api.letremouille.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.letremouille.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Corps minuscule : un formulaire fait quelques centaines d'octets
    client_max_body_size 32k;
    client_body_timeout 10s;

    # Réponses d'erreur en JSON, comme l'API
    error_page 413 = @tremouille_413;
    error_page 429 = @tremouille_429;
    location @tremouille_413 { default_type application/json; return 413 '{"error":"Requête trop volumineuse"}'; }
    location @tremouille_429 { default_type application/json; return 429 '{"error":"Trop de requêtes"}'; }

    location / {
        limit_req zone=tremouille_api_req burst=5 nodelay;
        limit_req_status 429;
        limit_conn tremouille_api_conn 5;
        limit_conn_status 429;

        proxy_pass http://172.18.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
