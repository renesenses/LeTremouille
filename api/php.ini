; Réglages de production de l'API (copiés dans l'image)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
error_reporting = E_ALL
max_execution_time = 30
max_input_time = 10
memory_limit = 64M
post_max_size = 64K
upload_max_filesize = 0
file_uploads = Off
max_input_vars = 50
allow_url_fopen = Off
